<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Exibição</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    /* Mesma Outfit do app React (src/index.css). O fallback sans-serif segura o
       layout nas TVs que nao baixarem a fonte — o default delas costuma ser
       serif, que destoa do resto do produto. */
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      cursor: none;
      font-family: 'Outfit', 'Helvetica Neue', Arial, sans-serif;
    }

    /* Palco: tudo o que vai ao ar. Na TV em pé, a TV é uma tela comum girada na
       parede e a box segue mandando imagem deitada; quem gira é este palco.
       Largura e altura trocadas (100vh x 100vw) e rotação em torno do centro.
       As medidas internas em vh não mudam: 1vh segue sendo 1% do lado curto
       da tela, que é o que legenda e QR usam. */
    #stage {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden;
    }
    #stage.portrait-right,
    #stage.portrait-left {
      right: auto; bottom: auto;
      top: 50%; left: 50%;
      width: 100vh; height: 100vw;
    }
    #stage.portrait-right {
      -webkit-transform: translate(-50%, -50%) rotate(90deg);
      transform: translate(-50%, -50%) rotate(90deg);
    }
    #stage.portrait-left {
      -webkit-transform: translate(-50%, -50%) rotate(-90deg);
      transform: translate(-50%, -50%) rotate(-90deg);
    }

    #slot-a, #slot-b {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
    }
    #slot-a { opacity: 1; z-index: 1; }
    #slot-b { opacity: 0; z-index: 1; }

    .slot-enter { -webkit-transition: opacity 1.2s ease-in-out; transition: opacity 1.2s ease-in-out; }

    /* Alinhado ao #qr-box pela base (3vh). O limite à direita reserva a largura
       do QR (14vh = 12vh da imagem + 1vh de padding em cada lado) mais 3vh de
       respiro; a altura do #qr-box é maior por causa do #qr-label. */
    #overlay {
      position: absolute;
      bottom: 3vh; left: 3vh; right: 20vh;
      z-index: 3;
    }

    /* Espelho ES5 do componente React em src/components/slide-caption.tsx —
       mudou lá, mude aqui.

       Nada de backdrop-filter, box-shadow ou text-shadow: o container sólido já
       garante o contraste, e esses efeitos custam caro nas TVs mais fracas. */
    #caption {
      display: inline-block;
      max-width: 100%;
      height: 14vh;
      /* line-height igual à altura centraliza o texto sem flexbox, que é
         instável nos navegadores das TVs mais antigas. */
      line-height: 14vh;
      padding: 0 3vh;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      font-size: 5vh;
      font-weight: 500;
      letter-spacing: -0.5px;
      /* Altura fixa exige uma linha só: texto longo termina em reticências. */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: #000;                 /* fallback para WebKit sem rgba */
      background: rgba(0,0,0,0.55);
      -webkit-border-radius: 1vh;
      border-radius: 1vh;
    }

    #progress-track {
      position: absolute;
      bottom: 0; left: 0; right: 0; height: 4px; z-index: 4;
      background: rgba(255,255,255,0.12);
    }
    #progress-fill {
      height: 100%; width: 0;
      background: #4f46e5;
    }

    #empty-screen {
      display: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: 10;
      -webkit-box-align: center; -ms-flex-align: center; align-items: center;
      -webkit-box-pack: center; -ms-flex-pack: center; justify-content: center;
      -webkit-box-orient: vertical; -webkit-box-direction: normal; -ms-flex-direction: column; flex-direction: column;
      background: #000;
      color: rgba(255,255,255,0.4);
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 32px;
    }
    #empty-screen.visible { display: -webkit-box; display: -ms-flexbox; display: flex; }
    #empty-icon {
      width: 80px; height: 80px;
      margin-bottom: 24px;
      opacity: 0.2;
    }
    #empty-title { font-size: 28px; font-weight: 400; margin-bottom: 8px; }
    #empty-sub { font-size: 16px; }

    /* TV sem device: QR para o admin vincular. Acima de tudo, como o aviso. */
    #pair-screen {
      display: none;
      position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      z-index: 60;
      background: #0b0f19;
      color: #e5e7eb;
      text-align: center;
      padding-top: 6vh;
    }
    #pair-screen.visible { display: block; }
    #pair-title { font-size: 34px; margin-bottom: 24px; }
    #pair-qr { width: 42vh; height: 42vh; background: #fff; }
    #pair-help { font-size: 20px; margin-top: 24px; }
    #pair-key { font-size: 44px; letter-spacing: 6px; font-family: monospace; margin-top: 16px; }
    #pair-url { font-size: 18px; margin-top: 12px; color: #9ca3af; }
    #qr-box {
      position: absolute;
      right: 3vh; bottom: 3vh;
      background: #fff;
      padding: 1vh;
      border-radius: 1vh;
      display: none;
      z-index: 3;
    }
    /* Espelho ES5 do rotulo em src/pages/display.tsx — mudou la, mude aqui. */
    #qr-label {
      width: 12vh;
      margin-bottom: 0.5vh;
      font-size: 1.8vh;
      line-height: 2.4vh;
      font-weight: 600;
      letter-spacing: 0.12em;
      /* Compensa o letter-spacing que sobra depois do ultimo caractere. */
      text-indent: 0.12em;
      text-align: center;
      color: #000;
    }
    #qr-img { display: block; width: 12vh; height: 12vh; }
    /* Espelha `src/components/fullscreen-hint.tsx` — mudou aqui, mude la.
       Acima do #empty-screen para o operador ver o aviso mesmo sem slides. */
    #fs-hint {
      display: none;
      position: absolute;
      top: 3vh; right: 3vh;
      z-index: 11;
      padding: 1vh 1.6vh;
      border-radius: 1vh;
      background: #000;                 /* fallback para WebKit sem rgba */
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      font-size: 1.8vh;
      line-height: 2.4vh;
    }
  </style>
</head>
<body>
  <div id="stage">
    <div id="slot-a"></div>
    <div id="slot-b"></div>
    <div id="yt-slot" style="position:absolute;top:0;left:0;right:0;bottom:0;z-index:2;display:none;background:#000;"></div>

    <div id="overlay">
      <div id="caption"></div>
    </div>

    <div id="progress-track">
      <div id="progress-fill"></div>
    </div>

    <div id="qr-box"><div id="qr-label">SAIBA +</div><img id="qr-img" alt="" /></div>

    <div id="empty-screen">
      <svg id="empty-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/>
        <line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <div id="empty-title">Nenhum slide configurado</div>
      <div id="empty-sub">Acesse o painel admin e adicione anúncios à playlist deste dispositivo.</div>
    </div>
  </div>

  <div id="fs-hint">Pressione OK para tela cheia</div>

  <div id="pair-screen">
    <div id="pair-title">Vincular esta TV</div>
    <img id="pair-qr" alt="" />
    <div id="pair-help">Leia o QR code com o celular do administrador</div>
    <div id="pair-key"></div>
    <div id="pair-url"></div>
  </div>

  <script>
    (function () {
      'use strict';

      // ─── State ───────────────────────────────────────────────────────────────
      var slides        = [];
      var currentIndex  = 0;
      var elapsed       = 0;
      var tickMs        = 80;
      var timer         = null;
      var playSent = false;
      var activeSlot    = 'a';   // 'a' or 'b'
      // Artes que nao carregaram desde a ultima que carregou. Publicar um
      // painel apaga do storage a arte da publicacao anterior, entao uma TV que
      // ainda nao pegou a lista nova pede uma URL que ja morreu. Sem contar
      // isso, a TV gira a lista inteira pedindo imagem que nunca vem.
      var falhasDeArte  = 0;

      var ytPlayer      = null;
      var ytApiReady    = false;
      var ytApiLoading  = false;
      var ytApiUnavailable = false;   // API do YouTube desistiu de carregar
      var YT_API_TIMEOUT_MS = 6000;   // limite p/ a IFrame API ficar pronta
      var ytInitTimer   = null;
      var ytEndWatch    = null;   // vigia do fim do vídeo (Shorts não dão ENDED)
      var YT_END_WATCH_MS = 500;
      var ytSoundTimer  = null;   // confere se o vídeo com som começou a tocar
      var YT_SOUND_CHECK_MS = 3000;
      var ytUltimaPosicao = 0;   // última posição lida pela vigia (s)
      var ytActive      = false;
      var ytFallback    = false;   // slide de vídeo caiu no fallback de imagem
      var playlistCursor = {};   // announcementId -> índice atual
      var videoPositions = {};   // (announcementId + '-' + videoId) -> segundos
      var ytSlot        = document.getElementById('yt-slot');

      // ─── DOM refs ─────────────────────────────────────────────────────────────
      var slotA        = document.getElementById('slot-a');
      var slotB        = document.getElementById('slot-b');
      var overlayEl    = document.getElementById('overlay');
      var captionEl    = document.getElementById('caption');
      var fillEl       = document.getElementById('progress-fill');
      var emptyEl      = document.getElementById('empty-screen');
      var qrBox        = document.getElementById('qr-box');
      var qrImg        = document.getElementById('qr-img');
      var stageEl      = document.getElementById('stage');
      var screenOrientation = 'landscape';

      // Aplica o giro que o servidor mandou. Devolve true se mudou, para o
      // chamador recomeçar a rotação do primeiro slide já no formato novo.
      function applyOrientation(orientation) {
        var o = orientation === 'portrait_right' || orientation === 'portrait_left' ? orientation : 'landscape';
        stageEl.className = o === 'portrait_right' ? 'portrait-right' : o === 'portrait_left' ? 'portrait-left' : '';
        var mudou = o !== screenOrientation;
        screenOrientation = o;
        return mudou;
      }

      // ─── Helpers ─────────────────────────────────────────────────────────────
      function getKey() {
        var search = window.location.search;
        var match = search.match(/[?&]key=([^&]*)/);
        return match ? decodeURIComponent(match[1]) : '';
      }

      var STORAGE_KEY = 'signage.deviceKey';

      function readStoredKey() {
        try { return window.localStorage.getItem(STORAGE_KEY) || ''; }
        catch (e) { return ''; }
      }

      function storeKey(key) {
        try { window.localStorage.setItem(STORAGE_KEY, key); }
        catch (e) {}
      }

      // Mesmo formato do servidor: 16 hex maiúsculos. TV antiga sem crypto cai
      // no Math.random misturado ao relógio; a unicidade quem garante é o banco.
      function generateKey() {
        var out = '';
        var c = window.crypto || window.msCrypto;
        if (c && c.getRandomValues) {
          var bytes = new Uint8Array(8);
          c.getRandomValues(bytes);
          for (var i = 0; i < bytes.length; i++) {
            out += (bytes[i] < 16 ? '0' : '') + bytes[i].toString(16);
          }
        } else {
          var seed = new Date().getTime();
          while (out.length < 16) {
            out += (((Math.random() * 16) ^ (seed >>> ((out.length % 8) * 4))) & 15).toString(16);
          }
        }
        return out.toUpperCase();
      }

      // Mesma normalização do servidor (lib/device-key.ts): maiúsculas, sem
      // espaço nem traço. Uma TV aberta com a key em blocos ou minúscula
      // (como o admin comparte) tem de bater com a key que o servidor guarda;
      // senão pergunta pra sempre por um device que já existe. Key fora do
      // formato de 16 hex é legado (ex.: id antigo) e fica como veio.
      function normalizeUrlKey(raw) {
        var normalizado = raw.replace(/[\s-]/g, '').toUpperCase();
        return /^[0-9A-F]{16}$/.test(normalizado) ? normalizado : raw;
      }

      // URL (TVs antigas, não gravada) → guardada → nova, gravada.
      function resolveKey() {
        var fromUrl = getKey();
        if (fromUrl) { return normalizeUrlKey(fromUrl); }
        var stored = readStoredKey();
        if (stored) { return stored; }
        var fresh = generateKey();
        storeKey(fresh);
        return fresh;
      }

      var deviceKey = resolveKey();

      function apiBase() {
        // Origin only — API is always at /api/
        return window.location.protocol + '//' + window.location.host;
      }

      function imgUrl(imageUrl) {
        if (!imageUrl) { return ''; }
        if (/^https?:\/\//i.test(imageUrl)) {
          return imageUrl;
        }
        if (imageUrl.indexOf('/api/') === 0) {
          return apiBase() + imageUrl;
        }
        var filename = imageUrl.split('/').pop();
        return apiBase() + '/api/uploads/' + filename;
      }

      // O status vai junto: 404 significa "TV sem device" (pareamento), que
      // não pode ser confundido com rede fora do ar. Em erro, o corpo também
      // vai junto (5º argumento) porque nem todo 404 é o do device — um
      // proxy/misroute pode devolver outro corpo, e só o corpo exato da API
      // (GetDisplayFeed -> routes/display.ts) deve abrir o pareamento.
      function xhrGet(url, cb) {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', url, true);
        xhr.onreadystatechange = function () {
          if (xhr.readyState !== 4) { return; }
          if (xhr.status >= 200 && xhr.status < 300) {
            try { cb(null, JSON.parse(xhr.responseText), xhr.status); }
            catch (e) { cb(e, null, xhr.status); }
          } else {
            var body = null;
            try { body = JSON.parse(xhr.responseText); } catch (e) {}
            cb(new Error('HTTP ' + xhr.status), null, xhr.status, body);
          }
        };
        xhr.send();
      }

      function xhrPost(url, payload) {
        try {
          var xhr = new XMLHttpRequest();
          xhr.open('POST', url, true);
          xhr.setRequestHeader('Content-Type', 'application/json');
          xhr.send(JSON.stringify(payload));
        } catch (e) { /* fire and forget */ }
      }

      // ─── Pre-load image silently ───────────────────────────────────────────
      function preload(url) {
        var img = new Image();
        img.src = url;
      }

      // ─── YouTube IFrame API (ES5) ───────────────────────────────────────────
      function loadYtApi(cb, onFail) {
        if (window.YT && window.YT.Player) { cb(); return; }
        if (ytApiUnavailable) { if (onFail) onFail(); return; }

        var failed = false;
        var giveUp = setTimeout(function () {
          failed = true;
          ytApiUnavailable = true;
          if (onFail) onFail();
        }, YT_API_TIMEOUT_MS);

        if (ytApiLoading) {
          var t = setInterval(function () {
            if (failed) { clearInterval(t); return; }
            if (window.YT && window.YT.Player) {
              clearInterval(t); clearTimeout(giveUp); cb();
            }
          }, 100);
          return;
        }

        ytApiLoading = true;
        var prev = window.onYouTubeIframeAPIReady;
        window.onYouTubeIframeAPIReady = function () {
          if (prev) { try { prev(); } catch (e) {} }
          ytApiReady = true;
          if (failed) { return; }
          clearTimeout(giveUp);
          cb();
        };
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        tag.onerror = function () {
          if (failed) { return; }
          failed = true;
          ytApiUnavailable = true;
          clearTimeout(giveUp);
          if (onFail) onFail();
        };
        document.head.appendChild(tag);
      }

      function teardownYt() {
        ytActive = false;
        if (ytInitTimer) { clearTimeout(ytInitTimer); ytInitTimer = null; }
        if (ytEndWatch) { clearInterval(ytEndWatch); ytEndWatch = null; }
        if (ytSoundTimer) { clearTimeout(ytSoundTimer); ytSoundTimer = null; }
        if (ytPlayer) {
          try { ytPlayer.destroy(); } catch (e) {}
          ytPlayer = null;
        }
        ytSlot.style.display = 'none';
        ytSlot.innerHTML = '';
      }

      function videoIdForSlide(slide) {
        if (slide.mediaKind === 'youtube_playlist') {
          var ids = slide.videoIds || [];
          if (!ids.length) { return null; }
          var cur = playlistCursor[slide.announcementId] || 0;
          return ids[cur % ids.length];
        }
        if (slide.mediaKind === 'youtube_video') {
          return slide.youtubeId || null;
        }
        return null;
      }

      function advancePlaylistCursor(slide) {
        if (slide.mediaKind === 'youtube_playlist') {
          var ids = slide.videoIds || [];
          if (ids.length) {
            var cur = playlistCursor[slide.announcementId] || 0;
            playlistCursor[slide.announcementId] = (cur + 1) % ids.length;
          }
        }
      }

      // O player do YouTube repete Shorts em laço: no fim o tempo volta a 0 e o
      // estado vai PLAYING -> BUFFERING -> PLAYING, sem nunca emitir ENDED. Sem
      // isto, peça em modo natural ficava presa no mesmo Short para sempre.
      // Olha a posição de tempos em tempos: se estava perto do fim e voltou
      // para trás, o vídeo acabou. A folga de 2 s cobre o intervalo da vigia
      // (e o setInterval mais lento de aba/TV em segundo plano).
      function vigiarFim(player, onEnded) {
        if (ytEndWatch) { clearInterval(ytEndWatch); }
        var anterior = 0;
        ytUltimaPosicao = 0;
        ytEndWatch = setInterval(function () {
          var agora, duracao;
          try {
            agora = player.getCurrentTime();
            duracao = player.getDuration();
          } catch (e) { return; }
          if (typeof agora !== 'number') { return; }
          if (duracao > 0 && agora + 1 < anterior && anterior >= duracao - 2) {
            clearInterval(ytEndWatch); ytEndWatch = null;
            onEnded();
            return;
          }
          anterior = agora;
          // Guardada fora da checagem de duração: é o plano B quando o
          // YouTube não informa a duração (duracaoDoVideo). Atualizada depois
          // da detecção do laço, então no laço ainda vale a posição do fim.
          ytUltimaPosicao = agora;
        }, YT_END_WATCH_MS);
      }

      // Tempo total do vídeo que acabou de terminar. Lido antes de goNext
      // destruir o player. Sem duração do YouTube, a última posição lida é
      // praticamente a duração; sem nenhuma das duas, a configurada na peça.
      function duracaoDoVideo(slide) {
        var d = 0;
        try { d = ytPlayer ? ytPlayer.getDuration() : 0; } catch (e) { d = 0; }
        if (typeof d === 'number' && d > 0 && isFinite(d)) { return d; }
        if (ytUltimaPosicao > 0) { return ytUltimaPosicao; }
        return slide.duration;
      }

      // Navegador sem interação do usuário (Chrome, TV box fora do app) bloqueia
      // autoplay com som: o player fica pronto, sai do mudo e para em
      // UNSTARTED sem erro nenhum. Em modo natural a TV travava nessa peça.
      // Se não estiver tocando depois de um tempo, vale mais mudo do que tela
      // parada. O app Android libera som sem gesto, então lá isto não dispara.
      function garantirQueToca(player) {
        if (ytSoundTimer) { clearTimeout(ytSoundTimer); }
        ytSoundTimer = setTimeout(function () {
          ytSoundTimer = null;
          var estado;
          try { estado = player.getPlayerState(); } catch (e) { return; }
          var S = window.YT.PlayerState;
          if (estado === S.PLAYING || estado === S.BUFFERING || estado === S.ENDED) { return; }
          try { player.mute(); player.playVideo(); } catch (e) {}
        }, YT_SOUND_CHECK_MS);
      }

      // Toca um vídeo do YouTube; se não inicializar em 5s ou der erro, chama
      // onFail() para o chamador cair no fallback de imagem.
      function playYouTube(slide, videoId, onEnded, onFail) {
        loadYtApi(function () {
          var holder = document.createElement('div');
          ytSlot.innerHTML = '';
          ytSlot.appendChild(holder);
          ytSlot.style.display = 'block';
          ytActive = true;

          var started = false;
          ytInitTimer = setTimeout(function () {
            if (!started) { teardownYt(); onFail(); }
          }, 5000);

          ytPlayer = new window.YT.Player(holder, {
            width: '100%',
            height: '100%',
            videoId: videoId,
            playerVars: {
              autoplay: 1, mute: 1, controls: 0, rel: 0,
              modestbranding: 1, playsinline: 1, disablekb: 1, fs: 0
            },
            events: {
              onReady: function (e) {
                started = true;
                if (ytInitTimer) { clearTimeout(ytInitTimer); ytInitTimer = null; }
                if (slide.audioMode === 'sound') {
                  try { e.target.unMute(); e.target.setVolume(100); } catch (err) {}
                }
                var posKey = slide.announcementId + '-' + videoId;
                var saved = videoPositions[posKey];
                if (saved && saved > 0) {
                  try { e.target.seekTo(saved, true); } catch (err) {}
                }
                e.target.playVideo();
                if (slide.audioMode === 'sound') { garantirQueToca(e.target); }
                vigiarFim(e.target, onEnded);
              },
              onStateChange: function (e) {
                if (e.data === window.YT.PlayerState.ENDED) {
                  onEnded();
                }
              },
              onError: function () {
                if (ytInitTimer) { clearTimeout(ytInitTimer); ytInitTimer = null; }
                teardownYt();
                onFail();
              }
            }
          });
        }, onFail);
      }

      // ─── Crossfade to a new slide ─────────────────────────────────────────
      function showSlide(slide) {
        teardownYt();
        // Slides de YouTube só desenham imagem quando caírem em fallback (feito
        // pelo onFail em startTimer). Aqui, para imagem, desenha normalmente.
        if (!slide.mediaKind || slide.mediaKind === 'image') {
          showImageSlide(slide);
        } else {
          // Mantém legenda/QR visíveis por cima do vídeo.
          applyCaptionAndQr(slide);
        }
      }

      function applyCaptionAndQr(slide) {
        // O servidor já resolveu se há texto a exibir: null = slide sem legenda.
        var caption = slide.displayText;
        if (caption) {
          captionEl.textContent = caption;
          overlayEl.style.display = 'block';
        } else {
          captionEl.textContent = '';
          overlayEl.style.display = 'none';
        }

        if (slide.qrImageUrl) {
          qrImg.src = apiBase() + slide.qrImageUrl;
          qrBox.style.display = 'block';
        } else {
          qrBox.style.display = 'none';
          qrImg.removeAttribute('src');
        }
      }

      // Pinta a arte já carregada no próximo slot e faz o crossfade.
      function paintImageSlide(slide, url) {
        var prev = activeSlot === 'a' ? slotA : slotB;
        var next = activeSlot === 'a' ? slotB : slotA;

        next.style.backgroundImage = 'url(' + url + ')';
        next.style.zIndex = '2';
        next.style.opacity = '1';
        next.className = 'slot-enter';

        prev.style.zIndex = '1';
        prev.style.opacity = '0';

        applyCaptionAndQr(slide);

        activeSlot = activeSlot === 'a' ? 'b' : 'a';

        // Preload next image (apenas se o próximo slide for imagem)
        var nextIdx = (currentIndex + 1) % slides.length;
        if (slides[nextIdx] && (!slides[nextIdx].mediaKind || slides[nextIdx].mediaKind === 'image') && slides[nextIdx].imageUrl) {
          preload(imgUrl(slides[nextIdx].imageUrl));
        }
      }

      /**
       * Só troca a tela depois que a arte carregou.
       *
       * `background-image` não avisa quando a URL falha: a versão anterior
       * pintava a URL direto e uma arte morta virava tela preta muda, com o
       * slide ainda contando exibição como se tivesse ido ao ar. Agora a arte é
       * carregada antes; se falhar, tenta uma vez furando cache (TV que guardou
       * um 404) e, persistindo, cede a vez para o próximo slide sem contar play.
       */
      function showImageSlide(slide) {
        var url = imgUrl(slide.imageUrl);
        if (!url) { onArteFalhou(slide, 'sem URL de arte'); return; }

        var pedido = currentIndex;
        var img = new Image();
        img.onload = function () {
          // Chegou tarde, depois de a TV já ter passado adiante: ignora, senão
          // a arte atrasada some por cima do slide que está no ar agora.
          if (pedido !== currentIndex) { return; }
          falhasDeArte = 0;
          paintImageSlide(slide, url);
        };
        img.onerror = function () {
          if (pedido !== currentIndex) { return; }
          if (!slide.__reTentada) {
            slide.__reTentada = true;
            var furaCache = url + (url.indexOf('?') === -1 ? '?' : '&') + 'r=' + (new Date()).getTime();
            var retry = new Image();
            retry.onload = function () {
              if (pedido !== currentIndex) { return; }
              falhasDeArte = 0;
              paintImageSlide(slide, furaCache);
            };
            retry.onerror = function () {
              if (pedido !== currentIndex) { return; }
              onArteFalhou(slide, 'arte não carregou');
            };
            retry.src = furaCache;
            return;
          }
          onArteFalhou(slide, 'arte não carregou');
        };
        img.src = url;
      }

      /**
       * Arte que não veio: passa adiante sem contar exibição.
       *
       * Se a volta inteira falhar, para em vez de girar para sempre pedindo
       * imagem que não existe — o refresh de 60 s traz a lista nova e a TV
       * volta sozinha quando o servidor tiver artes válidas de novo.
       */
      function onArteFalhou(slide, motivo) {
        if (window.console && console.warn) {
          console.warn('[tv] slide ' + (slide && slide.announcementId) + ': ' + motivo + ' (' + imgUrl(slide && slide.imageUrl) + ')');
        }
        falhasDeArte += 1;
        if (falhasDeArte >= slides.length) {
          showEmpty('Sem arte para exibir', 'A TV tenta de novo assim que o servidor publicar as artes.');
          return;
        }
        goNextNoCount();
      }

      // ─── Impression recording ─────────────────────────────────────────────
      // durationSeconds omitido = a duração configurada (imagem, miniatura de
      // fallback). Vídeo passa o tempo total do vídeo (duracaoDoVideo).
      function recordImpression(slide, durationSeconds) {
        if (playSent) { return; }
        playSent = true;
        var key = deviceKey;
        if (!key) { return; }
        xhrPost(apiBase() + '/api/telemetry/play', {
          deviceKey: key,
          announcementId: slide.announcementId,
          campaignId: slide.campaignId != null ? slide.campaignId : null,
          durationSeconds: durationSeconds != null ? durationSeconds : slide.duration
        });
      }

      // ─── Timer loop ───────────────────────────────────────────────────────
      function goNext(durationSeconds) {
        if (timer) { clearInterval(timer); timer = null; }
        var leaving = slides[currentIndex];
        if (leaving) {
          var leavingVid = videoIdForSlide(leaving);
          if (leavingVid) { delete videoPositions[leaving.announcementId + '-' + leavingVid]; }
        }
        recordImpression(slides[currentIndex], durationSeconds);
        advancePlaylistCursor(slides[currentIndex]);
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(slides[currentIndex]);
        startTimer();
      }

      // Corte de vídeo capped: cede a tela sem contar play nem avançar cursor.
      function goNextNoCount() {
        if (timer) { clearInterval(timer); timer = null; }
        currentIndex = (currentIndex + 1) % slides.length;
        showSlide(slides[currentIndex]);
        startTimer();
      }

      function startTimer() {
        if (timer) { clearInterval(timer); timer = null; }
        elapsed = 0;
        playSent = false;
        ytFallback = false;
        fillEl.style.width = '0';

        var slide = slides[currentIndex];
        var vid = (slide.mediaKind && slide.mediaKind !== 'image') ? videoIdForSlide(slide) : null;

        if (vid) {
          var naturalDone = false;
          playYouTube(
            slide, vid,
            function onEnded() { if (!naturalDone) { naturalDone = true; goNext(duracaoDoVideo(slide)); } },
            function onFail() {
              // Fallback: mostra a thumbnail nos slots de imagem e usa o timer.
              ytFallback = true;
              slide.imageUrl = slide.imageUrl ||
                ('https://img.youtube.com/vi/' + (slide.youtubeId || vid) + '/hqdefault.jpg');
              showImageSlide(slide);
              runTimer(slide);
            }
          );
          if (slide.playbackMode === 'natural') {
            return; // avança no onEnded; sem cronômetro
          }
          // capped: roda o cronômetro em paralelo ao vídeo
          runTimer(slide);
          return;
        }

        // YouTube sem vídeo resolvido (ex.: playlist sem API key) → mostra a
        // thumbnail/imagem de fallback em vez de congelar o slide anterior.
        if (slide.mediaKind && slide.mediaKind !== 'image') {
          if (!slide.imageUrl && slide.youtubeId) {
            slide.imageUrl = 'https://img.youtube.com/vi/' + slide.youtubeId + '/hqdefault.jpg';
          }
          showImageSlide(slide);
          runTimer(slide);
          return;
        }

        // Imagem: showSlide já desenhou o slide; só roda o cronômetro.
        runTimer(slide);
      }

      function runTimer(slide) {
        var durationMs = slide.duration * 1000;
        if (timer) { clearInterval(timer); }
        timer = setInterval(function () {
          elapsed += tickMs;
          var pct = Math.min((elapsed / durationMs) * 100, 100);
          fillEl.style.width = pct + '%';
          if (elapsed >= durationMs) {
            var s = slides[currentIndex];
            // Vídeo capped ainda tocando OU carregando (sem ter caído no
            // fallback de imagem): cede a tela sem contar play nem avançar
            // cursor — o vídeo retoma depois. Só imagem/fallback conta play.
            var vid = (s && s.playbackMode !== 'natural') ? videoIdForSlide(s) : null;
            var isCappedVideo = !!vid && !ytFallback;
            if (isCappedVideo) {
              if (ytActive && ytPlayer) {
                try { videoPositions[s.announcementId + '-' + vid] = ytPlayer.getCurrentTime(); } catch (e) {}
              }
              goNextNoCount();
            } else {
              goNext();
            }
          }
        }, tickMs);
      }

      // ─── Load slides from API ─────────────────────────────────────────────
      var refreshTimer = null;

      // Tira tudo da tela e para o loop. Usada quando o servidor diz que esta
      // TV não tem mais nada a exibir agora — campanha que acabou, que saiu do
      // alvo ou que não roda hoje.
      function showEmpty(titulo, sub) {
        document.getElementById('empty-title').textContent = titulo || 'Nenhum slide configurado';
        document.getElementById('empty-sub').textContent =
          sub || 'Acesse o painel admin e adicione anúncios à playlist deste dispositivo.';
        if (timer) { clearInterval(timer); timer = null; }
        teardownYt();
        slides = [];
        currentIndex = 0;
        elapsed = 0;
        slotA.style.opacity = '0';
        slotB.style.opacity = '0';
        overlayEl.style.display = 'none';
        qrBox.style.display = 'none';
        fillEl.style.width = '0%';
        emptyEl.className = 'visible';
      }

      var PAIR_POLL_MS = 5000;
      var pairEl = document.getElementById('pair-screen');
      var pairTimer = null;

      function formatKey(key) {
        return key.match(/.{1,4}/g).join('-');
      }

      // Servidor não conhece a key: sem device ainda, ou device apagado. Tira
      // tudo do ar, mostra o QR e pergunta de novo a cada 5 s.
      function showPairing(key) {
        showEmpty();
        emptyEl.className = '';
        document.getElementById('pair-qr').src = apiBase() + '/api/qr/pair/' + encodeURIComponent(key) + '.png';
        document.getElementById('pair-key').textContent = formatKey(key);
        document.getElementById('pair-url').textContent = apiBase() + '/parear/' + key;
        pairEl.className = 'visible';
        if (!pairTimer) {
          pairTimer = setInterval(function () { fetchAndStart(key, true); }, PAIR_POLL_MS);
        }
      }

      function hidePairing() {
        pairEl.className = '';
        if (pairTimer) { clearInterval(pairTimer); pairTimer = null; }
      }

      function fetchAndStart(key, isRefresh) {
        var url = apiBase() + '/api/display/' + encodeURIComponent(key) + '/feed';
        xhrGet(url, function (err, data, status, body) {
          // Só o 404 exato do device (routes/display.ts) é "sem device ainda":
          // qualquer outro corpo (proxy, misroute) é tratado como falha comum,
          // senão a TV abriria o pareamento por engano com um device que existe.
          if (status === 404 && body && body.error === 'Device not found') {
            showPairing(key);
            return;
          }
          // Rede caiu, ou outro erro/404 sem ser o do device: segura o que já
          // está no ar. Melhor a TV repetir a lista velha do que apagar por
          // causa de um GET perdido. Na primeira carga não há lista para
          // segurar, então mostra a tela de vazio.
          var lista = data && data.slides;
          if (err || !lista) {
            if (!isRefresh) { emptyEl.className = 'visible'; }
            return;
          }
          hidePairing();

          var girou = applyOrientation(data.screen && data.screen.orientation);

          // Lista vazia é resposta boa do servidor, não falha: a TV tem de
          // parar. Antes isso caía no mesmo return do erro e a campanha
          // seguia em loop para sempre depois de sair do ar.
          if (lista.length === 0) {
            showEmpty();
            return;
          }

          emptyEl.className = '';

          // Na atualização, só reinicia se a lista de slides (ou o giro) mudou
          var changed = girou || lista.length !== slides.length;
          if (!changed) {
            for (var i = 0; i < lista.length; i++) {
              if (lista[i].announcementId !== slides[i].announcementId) { changed = true; break; }
            }
          }

          slides = lista;

          // Lista nova: as artes que falharam podem ter sido substituídas.
          if (changed) { falhasDeArte = 0; }

          if (!isRefresh || changed) {
            if (timer) { clearInterval(timer); timer = null; }
            currentIndex = 0;
            showSlide(slides[0]);
            startTimer();
          }
        });
      }

      // ─── Tela cheia ───────────────────────────────────────────────────────
      // O navegador só entra em tela cheia depois de um gesto do usuário, então
      // a primeira tecla do controle (ou clique) pede a tela cheia. O aviso
      // some enquanto ela estiver ativa para não cobrir as peças.
      var fsRoot = document.documentElement;
      var fsHint = document.getElementById('fs-hint');

      function fsActive() {
        return !!(document.fullscreenElement || document.webkitFullscreenElement ||
          document.mozFullScreenElement || document.msFullscreenElement);
      }

      function fsRequestFn() {
        if (document.fullscreenEnabled === false) return null;
        return fsRoot.requestFullscreen || fsRoot.webkitRequestFullscreen ||
          fsRoot.webkitRequestFullScreen || fsRoot.mozRequestFullScreen ||
          fsRoot.msRequestFullscreen || null;
      }

      function updateFsHint() {
        fsHint.style.display = fsRequestFn() && !fsActive() ? 'block' : 'none';
      }

      function enterFullscreen() {
        if (fsActive()) return;
        var request = fsRequestFn();
        if (!request) return;
        try {
          var result = request.call(fsRoot);
          // Navegador que recusa rejeita a Promise; o player segue igual.
          if (result && typeof result.then === 'function') result.then(null, function () {});
        } catch (e) {}
      }

      // Dentro do app Android (artifacts/android-tv) a tela já é cheia: sem
      // aviso e sem gatilho. O app marca o user agent com "SignageApp/<versão>".
      var inAndroidApp = /SignageApp\//.test(navigator.userAgent || '');
      if (inAndroidApp) {
        fsHint.style.display = 'none';
      } else {
        document.addEventListener('keydown', enterFullscreen, false);
        document.addEventListener('click', enterFullscreen, false);
        var fsEvents = ['fullscreenchange', 'webkitfullscreenchange', 'mozfullscreenchange', 'MSFullscreenChange'];
        for (var fi = 0; fi < fsEvents.length; fi++) {
          document.addEventListener(fsEvents[fi], updateFsHint, false);
        }
        updateFsHint();
      }

      // ─── Init ─────────────────────────────────────────────────────────────
      function init() {
        fetchAndStart(deviceKey, false);

        // Refresh slide list every 60 s without interrupting current slide
        refreshTimer = setInterval(function () {
          fetchAndStart(deviceKey, true);
        }, 60000);
      }

      init();
    })();
  </script>
</body>
</html>
