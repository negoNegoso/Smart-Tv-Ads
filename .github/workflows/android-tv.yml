# App Android da TV (artifacts/android-tv).
# - Push/PR que mexe no app: testes JVM + build debug (só verificação).
# - Tag android-tv-vX.Y.Z: APK assinado anexado a um GitHub Release.
name: android-tv

on:
  push:
    branches: [main]
    paths:
      - "artifacts/android-tv/**"
      - ".github/workflows/android-tv.yml"
    # Filtro de paths não se aplica a tags: toda tag android-tv-v* dispara.
    tags: ["android-tv-v*"]
  pull_request:
    paths:
      - "artifacts/android-tv/**"
      - ".github/workflows/android-tv.yml"

permissions:
  contents: read

defaults:
  run:
    working-directory: artifacts/android-tv

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testes e build debug
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug

      - name: Relatório dos testes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: artifacts/android-tv/app/build/reports/tests/

  release:
    needs: test
    if: startsWith(github.ref, 'refs/tags/android-tv-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Versão da tag
        run: echo "VERSION=${GITHUB_REF_NAME#android-tv-v}" >> "$GITHUB_ENV"

      # O keystore só existe no disco do runner durante o job; nunca no log.
      - name: Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNAGE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret SIGNAGE_KEYSTORE_BASE64 não configurado (ver artifacts/android-tv/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signage-tv.jks"
          echo "SIGNAGE_KEYSTORE=$RUNNER_TEMP/signage-tv.jks" >> "$GITHUB_ENV"

      - name: APK release assinado
        env:
          SIGNAGE_KEYSTORE_PASS: ${{ secrets.SIGNAGE_KEYSTORE_PASS }}
          SIGNAGE_KEY_ALIAS: ${{ secrets.SIGNAGE_KEY_ALIAS }}
          SIGNAGE_KEY_PASS: ${{ secrets.SIGNAGE_KEY_PASS }}
        run: ./gradlew :app:assembleRelease -PversionName="$VERSION"

      - name: Confere assinatura e versão
        run: |
          APK="app/build/outputs/apk/release/signage-tv-$VERSION.apk"
          BT="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          "$BT/apksigner" verify "$APK"
          "$BT/aapt" dump badging "$APK" | head -1
          echo "APK=$APK" >> "$GITHUB_ENV"

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "Signage TV $VERSION" \
            --notes "APK para TV e TV box Android. Instalação: artifacts/android-tv/README.md." \
            $PRE

      - name: Apaga o keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/signage-tv.jks"
