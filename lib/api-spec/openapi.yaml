openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.2.0
  description: Digital Signage API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: announcements
  - name: cep
  - name: clients
  - name: devices
  - name: telemetry
  - name: analytics
  - name: users
  - name: portal
  - name: segments
  - name: public

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ── Público (landing page) ──────────────────────────────────────────────────
  /public/stats:
    get:
      operationId: getPublicStats
      tags: [public]
      summary: Aggregate counters for the public landing page
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"

  /public/pieces:
    get:
      operationId: getPublicPieces
      tags: [public]
      summary: Pieces on air, for the TV on the public landing page
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPieces"

  /public/vitrine/{orientation}/feed:
    get:
      operationId: getVitrineFeed
      tags: [public]
      summary: Rotação da TV vitrine da Smart Vale, para o player da landing
      description: >
        Mesmo formato de /display/{deviceKey}/feed, sem expor a key: a
        vitrine é achada pela orientação de tela. Cada consulta marca a
        vitrine como vista (lastSeenAt).
      parameters:
        - name: orientation
          in: path
          required: true
          schema: { type: string, enum: [landscape, portrait] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayFeed"
        "400":
          description: Orientação inválida
        "404":
          description: Nenhuma vitrine nessa orientação

  /public/vitrine/plays:
    post:
      operationId: recordVitrinePlays
      tags: [public]
      summary: Exibições da vitrine vistas por visitantes da landing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VitrinePlaysInput"
      responses:
        "200":
          description: Lote processado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayBatchResult"
        "202":
          description: Robô; nada gravado
        "400":
          description: Corpo inválido
        "404":
          description: Nenhuma vitrine nessa orientação

  # ── Announcements (global media library) ────────────────────────────────────
  /announcements:
    get:
      operationId: listAnnouncements
      tags: [announcements]
      summary: List all announcements
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"
    post:
      operationId: createAnnouncement
      tags: [announcements]
      summary: Create announcement (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnnouncementInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "400":
          description: Bad request

  /announcements/active:
    get:
      operationId: listActiveAnnouncements
      tags: [announcements]
      summary: List active announcements (global)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Announcement"

  /announcements/stats:
    get:
      operationId: getAnnouncementStats
      tags: [announcements]
      summary: Global announcement stats
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementStats"

  /announcements/reorder:
    post:
      operationId: reorderAnnouncements
      tags: [announcements]
      summary: Reorder announcements
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReorderInput"
      responses:
        "200":
          description: OK

  /announcements/{id}:
    get:
      operationId: getAnnouncement
      tags: [announcements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "404":
          description: Not found
    patch:
      operationId: updateAnnouncement
      tags: [announcements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/AnnouncementUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "404":
          description: Not found
    delete:
      operationId: deleteAnnouncement
      tags: [announcements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /announcements/{id}/toggle:
    patch:
      operationId: toggleAnnouncement
      tags: [announcements]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Announcement"
        "404":
          description: Not found

  /youtube/meta:
    get:
      operationId: getYouTubeMeta
      tags: [announcements]
      summary: Tipo, ID e orientação de um link do YouTube
      parameters:
        - { name: url, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YouTubeMeta"
        "400":
          description: Link inválido

  # ── Clients ──────────────────────────────────────────────────────────────────
  # ── Segments (ramo de atuação; base da regra de concorrência) ───────────────
  /segments:
    get:
      operationId: listSegments
      tags: [segments]
      summary: List all segments
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SegmentWithUsage"
    post:
      operationId: createSegment
      tags: [segments]
      summary: Create a segment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
        "400":
          description: Bad request
        "409":
          description: Segment already exists

  /segments/{id}:
    patch:
      operationId: renameSegment
      tags: [segments]
      summary: Rename a segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Segment"
        "400": { description: Bad request }
        "404": { description: Not found }
        "409": { description: Another segment already has this name }
    delete:
      operationId: deleteSegment
      tags: [segments]
      summary: Delete an unused segment
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Not found }
        "409":
          description: Segment in use; merge it instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentInUseError"

  /segments/{id}/merge:
    post:
      operationId: mergeSegment
      tags: [segments]
      summary: Merge a segment into another one
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SegmentMergeInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SegmentWithUsage"
        "400": { description: Bad request }
        "404": { description: Not found }

  # ── CEP (endereço + coordenadas; proxy de AwesomeAPI com BrasilAPI de reserva)
  /cep/{cep}:
    get:
      operationId: lookupCep
      tags: [cep]
      parameters:
        - { name: cep, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CepResult"
        "400": { description: CEP com formato inválido }
        "404": { description: CEP não encontrado }
        "502": { description: Serviços de CEP indisponíveis }

  # ── Companies (cadastro único; cliente e anunciante são papéis) ─────────────
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      parameters:
        - { name: status, in: query, required: false, schema: { type: string, enum: [active, paused, closed] } }
        - { name: role, in: query, required: false, schema: { type: string, enum: [client, advertiser] } }
        - { name: q, in: query, required: false, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Company" } }
    post:
      operationId: createCompany
      tags: [companies]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyDetail" }
        "400": { description: Dados inválidos ou nenhum papel marcado }
        "409": { description: Papel duplicado }

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyDetail" }
        "404": { description: Empresa não encontrada }
    patch:
      operationId: updateCompany
      tags: [companies]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CompanyUpdate" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CompanyDetail" }
        "400": { description: Dados inválidos ou nenhum papel }
        "404": { description: Empresa não encontrada }
        "409": { description: "Papel com TVs, painéis ou campanhas" }
    delete:
      operationId: deleteCompany
      tags: [companies]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204": { description: Deleted }
        "404": { description: Empresa não encontrada }
        "409": { description: "Empresa com TVs, painéis ou campanhas" }

  /clients:
    get:
      operationId: listClients
      tags: [clients]
      summary: List all clients
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Client"

  /clients/{id}:
    get:
      operationId: getClient
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Client"
        "404":
          description: Not found

  /clients/{id}/stats:
    get:
      operationId: getClientStats
      tags: [clients]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientStats"
        "404":
          description: Not found

  # ── Devices ──────────────────────────────────────────────────────────────────
  /devices:
    get:
      operationId: listDevices
      tags: [devices]
      summary: List devices, optionally filtered by client
      parameters:
        - name: clientId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
    post:
      operationId: createDevice
      tags: [devices]
      summary: Create a device linked to a client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Bad request
        "409":
          description: Device key already linked

  /devices/by-key/{key}:
    get:
      operationId: getDeviceByKey
      tags: [devices]
      summary: Find the device that owns a device key (TV pairing)
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "400":
          description: Invalid key format
        "404":
          description: Not found

  /devices/{id}:
    get:
      operationId: getDevice
      tags: [devices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
    patch:
      operationId: updateDevice
      tags: [devices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          description: Not found
    delete:
      operationId: deleteDevice
      tags: [devices]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /devices/{id}/playlist:
    get:
      operationId: getDevicePlaylist
      tags: [devices]
      summary: Get assigned playlist for a device
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlaylistItem"
        "404":
          description: Not found

  /devices/{id}/preview:
    get:
      operationId: getDevicePreview
      tags: [devices]
      summary: Slides the TV is showing right now, for the admin preview
      description: >
        Mesma rotação que /display/{deviceKey}/slides entrega à TV, com a
        origem de cada slide. Sem efeito colateral: não mexe em lastSeenAt.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DevicePreviewSlide"
        "404":
          description: Not found

  /devices/{id}/sessions:
    get:
      operationId: getDeviceSessions
      tags: [devices]
      summary: Períodos em que a TV esteve conectada nos últimos 30 dias
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSessions"
        "404":
          description: Not found

  /fleet:
    get:
      operationId: getFleet
      tags: [devices]
      summary: Parque de TVs — presença e versão do app de todas as telas
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Fleet"

  /fleet/update-requests:
    post:
      operationId: requestFleetUpdate
      tags: [devices]
      summary: Manda as TVs escolhidas (ou todas) checarem atualização do app agora
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FleetUpdateRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FleetUpdateResult"
        "400":
          description: Bad request

  /devices/{id}/playlist/add:
    post:
      operationId: addToDevicePlaylist
      tags: [devices]
      summary: Assign an announcement to a device
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistItemInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistItem"
        "400":
          description: Bad request

  /devices/{id}/playlist/reorder:
    post:
      operationId: reorderDevicePlaylist
      tags: [devices]
      summary: Reorder device playlist
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistReorder"
      responses:
        "200":
          description: OK

  /devices/{deviceId}/playlist/{announcementId}:
    delete:
      operationId: removeFromDevicePlaylist
      tags: [devices]
      summary: Remove an announcement from a device playlist
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: integer } }
        - { name: announcementId, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Removed
        "404":
          description: Not found

  /devices/{id}/playlist/{announcementId}/toggle:
    patch:
      operationId: togglePlaylistItem
      tags: [devices]
      summary: Toggle active status of a playlist item
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
        - { name: announcementId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlaylistItem"
        "404":
          description: Not found

  # ── Display (TV endpoint) ────────────────────────────────────────────────────
  /display/{deviceKey}/slides:
    get:
      operationId: getDeviceSlides
      tags: [devices]
      summary: Get active slides for a TV display by device key
      parameters:
        - { name: deviceKey, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DisplaySlide"
        "404":
          description: Device not found

  /display/{deviceKey}/feed:
    get:
      operationId: getDisplayFeed
      tags: [devices]
      summary: Rotação da TV e como a tela está montada
      description: >
        Mesma lista de /display/{deviceKey}/slides, junto com a orientação da
        TV para o player girar o palco. /slides continua para TVs com tv.html
        antigo em cache.
      parameters:
        - { name: deviceKey, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisplayFeed"
        "404":
          description: Device not found

  # ── Telemetry ────────────────────────────────────────────────────────────────
  /telemetry/play:
    post:
      operationId: recordPlay
      tags: [telemetry]
      summary: Record a slide play (proof-of-play) from a TV display
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayInput"
      responses:
        "201":
          description: Recorded
        "400":
          description: Bad request

  /telemetry/plays:
    post:
      operationId: recordPlays
      tags: [telemetry]
      summary: Record a batch of plays queued by a TV (proof-of-play)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlayBatchInput"
      responses:
        "200":
          description: Batch processed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlayBatchResult"
        "400":
          description: Bad request
        "404":
          description: Device not found

  # ── Analytics ────────────────────────────────────────────────────────────────
  /analytics/overview:
    get:
      operationId: getAnalyticsOverview
      tags: [analytics]
      summary: Visão geral da rede no período — cards, série diária e TVs que funcionaram
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsOverview"
        "400":
          description: Período inválido

  /analytics/hourly:
    get:
      operationId: getAnalyticsHourly
      tags: [analytics]
      summary: Exibições por hora do dia (0–23, horário de São Paulo) no período
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsHourly"
        "400":
          description: Período inválido

  /analytics/rankings:
    get:
      operationId: getAnalyticsRankings
      tags: [analytics]
      summary: Top 10 campanhas, TVs e peças por exibições no período
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, enum: [7, 30, 90] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsRankings"
        "400":
          description: Período inválido

  /analytics/clients/{clientId}:
    get:
      operationId: getClientAnalytics
      tags: [analytics]
      parameters:
        - { name: clientId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClientAnalytics"
        "404":
          description: Not found

  /analytics/devices/{deviceId}:
    get:
      operationId: getDeviceAnalytics
      tags: [analytics]
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAnalytics"
        "404":
          description: Not found

  /analytics/announcements/{announcementId}:
    get:
      operationId: getAnnouncementAnalytics
      tags: [analytics]
      parameters:
        - { name: announcementId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnnouncementAnalytics"
        "404":
          description: Not found

  /analytics/campaigns/{campaignId}:
    get:
      operationId: getCampaignAnalytics
      tags: [analytics]
      parameters:
        - { name: campaignId, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignAnalytics"
        "404":
          description: Not found

  # ── Users ────────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserAccount"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"

  /users/{id}:
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAccount"
        "404":
          description: Not found
    delete:
      operationId: deleteUser
      tags: [users]
      summary: Delete a user
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /users/{id}/reset-password:
    post:
      operationId: resetUserPassword
      tags: [users]
      summary: Reset user password
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "404":
          description: Not found

  # ── Portal ───────────────────────────────────────────────────────────────────
  /portal/advertiser/campaigns:
    get:
      operationId: listPortalAdvertiserCampaigns
      tags: [portal]
      summary: List advertiser portal campaigns
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalCampaign"

  /portal/client/clients:
    get:
      operationId: listPortalClientClients
      tags: [portal]
      summary: Stores linked to the signed-in user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalClient"
        "403":
          description: Usuário sem vínculo de cliente

  /portal/client/devices:
    get:
      operationId: listPortalClientDevices
      tags: [portal]
      summary: List client portal devices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PortalDevice"

  # ── Panels (client portal) ────────────────────────────────────────────────
  /portal/client/panels:
    get:
      operationId: listClientPanels
      tags: [portal]
      summary: List client portal panels (admin sem clientId vê todas as lojas)
      parameters:
        - { name: clientId, in: query, required: false, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Panel"
        "400":
          description: Bad request
        "403":
          description: Forbidden
    post:
      operationId: createClientPanel
      tags: [portal]
      summary: Create a client portal panel (draft)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePanelRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "400":
          description: Bad request

  /portal/client/panels/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getClientPanel
      tags: [portal]
      summary: Get a client portal panel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found
    patch:
      operationId: updateClientPanel
      tags: [portal]
      summary: Update a client portal panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePanelRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Panel"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found
    delete:
      operationId: deleteClientPanel
      tags: [portal]
      summary: Delete a client portal panel
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found

  /portal/client/panels/{id}/items:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    put:
      operationId: replaceClientPanelItems
      tags: [portal]
      summary: Replace all items of a client portal panel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplacePanelItemsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PanelItem"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found

  /portal/client/panels/{id}/copy:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: copyClientPanel
      tags: [portal]
      summary: Copia o painel, como rascunho, para outras lojas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyPanelRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Panel"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found

  /portal/client/panels/{id}/publish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: publishClientPanel
      tags: [portal]
      summary: Publish a client portal panel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishPanelResponse"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found
        "422":
          description: Content could not be rendered

  /portal/client/panels/{id}/unpublish:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: unpublishClientPanel
      tags: [portal]
      summary: Unpublish a client portal panel
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishPanelResponse"
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found

  /portal/client/panels/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    post:
      operationId: uploadClientPanelImage
      tags: [portal]
      summary: Upload an image for a client portal panel item (multipart/form-data)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/UploadPanelImageRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [imageUrl]
                properties:
                  imageUrl: { type: string }
        "400":
          description: Bad request
        "403":
          description: Forbidden
        "404":
          description: Not found
        "413":
          description: Payload too large

  /portal/client/panels/{id}/campaign-options:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }
    get:
      operationId: listClientPanelCampaignOptions
      tags: [portal]
      summary: Campanhas da mesma empresa em que o encarte pode ser publicado
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PanelCampaignOption" }
        "403": { description: Forbidden }
        "404": { description: Not found }

  /portal/client/stores/{clientId}/identity:
    parameters:
      - { name: clientId, in: path, required: true, schema: { type: integer } }
    get:
      operationId: getClientStoreIdentity
      tags: [portal]
      summary: Identidade da loja usada nos encartes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreIdentity" }
        "403": { description: Forbidden }
        "404": { description: Not found }
    patch:
      operationId: updateClientStoreIdentity
      tags: [portal]
      summary: Atualiza logo, cores e horário da loja
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateStoreIdentityRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/StoreIdentity" }
        "400": { description: Bad request }
        "403": { description: Forbidden }
        "404": { description: Not found }

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: { type: string }

    PublicStats:
      type: object
      required: [plays30d, activeScreens, clients, segments, cities]
      properties:
        plays30d: { type: integer }
        activeScreens: { type: integer }
        clients: { type: integer }
        segments: { type: integer }
        # Cobertura por município do Vale do Ribeira. Só cidade com pelo menos
        # um estabelecimento parceiro entra na lista; nome de empresa, endereço
        # e coordenada nunca saem desta rota.
        cities:
          type: array
          items:
            type: object
            required: [ibge, companies]
            properties:
              ibge: { type: string }
              companies: { type: integer }

    # Peças que já estão no ar nas TVs, para a TV de demonstração da landing.
    # Só imagem, legenda que a TV já mostra e orientação: título interno,
    # anunciante, campanha e QR nunca saem desta rota.
    PublicPieces:
      type: object
      required: [pieces]
      properties:
        pieces:
          type: array
          items:
            type: object
            required: [imageUrl, caption, orientation, kind]
            properties:
              imageUrl: { type: string }
              caption: { type: string, nullable: true }
              orientation: { type: string, enum: [landscape, portrait] }
              # Formato que o visitante reconhece: vídeo do YouTube, encarte
              # gerado por painel do cliente ou imagem avulsa.
              kind: { type: string, enum: [image, video, flyer] }

    # ── Announcements ────────────────────────────────────────────────────────
    Announcement:
      type: object
      required: [id, title, isActive, displayOrder, duration, showText, mediaKind, playbackMode, audioMode, orientation, createdAt]
      properties:
        id: { type: integer }
        title: { type: string }
        # Texto exibido na TV; `title` é apenas o rótulo interno do painel.
        displayText: { type: string, nullable: true }
        showText: { type: boolean }
        imageUrl: { type: string, nullable: true }
        mediaKind: { type: string }
        youtubeId: { type: string, nullable: true }
        playbackMode: { type: string }
        audioMode: { type: string }
        # "landscape" | "portrait". Sem enum pelo mesmo motivo de mediaKind:
        # um valor novo não pode derrubar a lista inteira.
        orientation: { type: string }
        isActive: { type: boolean }
        displayOrder: { type: integer }
        duration: { type: integer }
        # "admin" (peça subida no painel de gestão) | "panel" (gerada pela
        # publicação de um painel do cliente — o admin não edita nem apaga
        # essas linhas, só despublica o painel de origem). Sem enum, como os
        # demais campos livres desta tabela (mediaKind, playbackMode,
        # audioMode): um terceiro valor não deve derrubar o parse da lista
        # inteira em GET /announcements.
        source: { type: string }
        createdAt: { type: string, format: date-time }

    AnnouncementInput:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        displayText: { type: string, nullable: true }
        showText: { type: boolean }
        duration: { type: integer, minimum: 1 }
        mediaKind: { type: string }
        youtubeUrl: { type: string }
        playbackMode: { type: string }
        audioMode: { type: string }
        orientation: { type: string, enum: [landscape, portrait] }

    AnnouncementUpdate:
      type: object
      properties:
        title: { type: string, minLength: 1 }
        displayText: { type: string, nullable: true }
        showText: { type: boolean }
        isActive: { type: boolean }
        displayOrder: { type: integer }
        duration: { type: integer, minimum: 1 }
        mediaKind: { type: string }
        youtubeUrl: { type: string }
        playbackMode: { type: string }
        audioMode: { type: string }
        orientation: { type: string, enum: [landscape, portrait] }

    AnnouncementStats:
      type: object
      required: [total, active, inactive]
      properties:
        total: { type: integer }
        active: { type: integer }
        inactive: { type: integer }

    ReorderInput:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer }

    # ── Segments ─────────────────────────────────────────────────────────────
    Segment:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }

    SegmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1 }

    SegmentWithUsage:
      type: object
      required: [id, slug, name, companyCount, campaignCount]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        companyCount: { type: integer }
        campaignCount: { type: integer }

    SegmentMergeInput:
      type: object
      required: [targetId]
      properties:
        targetId: { type: integer }

    CepResult:
      type: object
      required: [cep, street, district, city, state, cityIbge, lat, lng]
      properties:
        cep: { type: string }
        street: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        cityIbge: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }

    SegmentInUseError:
      type: object
      required: [error, companyCount, campaignCount]
      properties:
        error: { type: string }
        companyCount: { type: integer }
        campaignCount: { type: integer }

    CompanyFields:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        status: { type: string, enum: [active, paused, closed] }
        notes: { type: ["string", "null"] }
        cep: { type: ["string", "null"] }
        street: { type: ["string", "null"] }
        number: { type: ["string", "null"] }
        complement: { type: ["string", "null"] }
        district: { type: ["string", "null"] }
        city: { type: ["string", "null"] }
        state: { type: ["string", "null"] }
        cityIbge: { type: ["string", "null"] }
        lat: { type: ["number", "null"] }
        lng: { type: ["number", "null"] }
    CompanyInput:
      allOf:
        - $ref: "#/components/schemas/CompanyFields"
        - type: object
          required: [name, segmentId, isClient, isAdvertiser]
          properties:
            segmentId: { type: integer }
            isClient: { type: boolean }
            isAdvertiser: { type: boolean }
            advertiserCompany: { type: ["string", "null"] }
    CompanyUpdate:
      allOf:
        - $ref: "#/components/schemas/CompanyFields"
        - type: object
          properties:
            segmentId: { type: integer }
            isClient: { type: boolean }
            isAdvertiser: { type: boolean }
            advertiserCompany: { type: ["string", "null"] }
    Company:
      allOf:
        - $ref: "#/components/schemas/CompanyFields"
        - type: object
          required: [id, name, status, clientId, advertiserId, advertiserCompany, createdAt, updatedAt]
          properties:
            id: { type: integer }
            segmentId: { type: ["integer", "null"] }
            clientId: { type: ["integer", "null"] }
            advertiserId: { type: ["integer", "null"] }
            advertiserCompany: { type: ["string", "null"] }
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    CompanyDetail:
      allOf:
        - $ref: "#/components/schemas/Company"
        - type: object
          required: [dependencies]
          properties:
            dependencies:
              type: object
              required: [devices, panels, campaigns]
              properties:
                devices: { type: integer }
                panels: { type: integer }
                campaigns: { type: integer }

    # ── Clients ──────────────────────────────────────────────────────────────
    Client:
      type: object
      required: [id, companyId, name, createdAt, deviceCount]
      properties:
        id: { type: integer }
        companyId: { type: integer }
        name: { type: string }
        email: { type: ["string", "null"] }
        phone: { type: ["string", "null"] }
        segmentId: { type: ["integer", "null"] }
        segmentName: { type: ["string", "null"] }
        deviceCount: { type: integer }
        createdAt: { type: string, format: date-time }

    ClientStats:
      type: object
      required: [clientId, clientName, totalDevices, totalPlays, totalDuration]
      properties:
        clientId: { type: integer }
        clientName: { type: string }
        totalDevices: { type: integer }
        totalPlays: { type: integer }
        totalDuration: { type: integer }
        topAnnouncements:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementPlayStat"

    # ── Devices ──────────────────────────────────────────────────────────────
    Device:
      type: object
      required: [id, clientId, clientName, name, deviceKey, orientation, showcase, createdAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: string }
        name: { type: string }
        location: { type: ["string", "null"] }
        # "landscape" | "portrait_right" | "portrait_left". Sem enum pelo mesmo
        # motivo de Announcement.orientation: uma linha estranha no banco não
        # pode derrubar o parse da lista de TVs inteira.
        orientation: { type: string }
        deviceKey: { type: string }
        lastSeenAt: { type: ["string", "null"], format: date-time }
        showcase: { type: boolean }
        # Link do YouTube que toca em fundo na TV. Nulo = sem música.
        musicUrl: { type: ["string", "null"] }
        # Slide de clima e hora na volta desta TV.
        showWeather: { type: boolean }
        # A empresa dona da TV tem lat/lng; sem isso o clima não pode ser ligado.
        companyHasCoordinates: { type: boolean }
        # Recados da faixa do rodapé desta TV.
        tickerMessages:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }

    DeviceInput:
      type: object
      required: [clientId, name]
      properties:
        clientId: { type: integer }
        name: { type: string, minLength: 1 }
        location: { type: string }
        deviceKey: { type: string, pattern: "^[0-9A-F]{16}$" }

    DeviceUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        location: { type: ["string", "null"] }
        orientation: { type: string, enum: [landscape, portrait_right, portrait_left] }
        showcase: { type: boolean }
        # Link de vídeo ou playlist do YouTube. null ou vazio tira a música.
        musicUrl: { type: ["string", "null"] }
        showWeather: { type: boolean }
        # Recados da faixa (até 5, até 80 caracteres). Sem maxItems/maxLength
        # aqui de propósito: a API valida e devolve a mensagem em português.
        tickerMessages:
          type: array
          items: { type: string }

    # ── Parque de TVs ────────────────────────────────────────────────────────
    FleetDevice:
      type: object
      required: [id, clientId, clientName, name, location, showcase, lastSeenAt, isOnline, appVersion, outdated, updateRequestedAt]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        clientName: { type: string }
        name: { type: string }
        location: { type: ["string", "null"] }
        showcase: { type: boolean }
        lastSeenAt: { type: ["string", "null"], format: date-time }
        # Calculado no servidor: falou nos últimos 5 minutos.
        isOnline: { type: boolean }
        # Versão do app no último contato. Nulo = navegador, ou nunca conectou.
        appVersion: { type: ["string", "null"] }
        # Versão X.Y.Z menor que a da última release.
        outdated: { type: boolean }
        # Quando o admin mandou esta TV checar atualização. Nulo = nunca pediu.
        updateRequestedAt: { type: ["string", "null"], format: date-time }

    Fleet:
      type: object
      required: [latestVersion, devices]
      properties:
        # Nulo quando o GitHub não respondeu: nenhuma TV sai marcada.
        latestVersion: { type: ["string", "null"] }
        devices:
          type: array
          items:
            $ref: "#/components/schemas/FleetDevice"

    DeviceSession:
      type: object
      required: [startedAt, lastSeenAt]
      properties:
        startedAt: { type: string, format: date-time }
        lastSeenAt: { type: string, format: date-time }

    DeviceSessions:
      type: object
      required: [isOnline, sessions]
      properties:
        # Do relógio do servidor: diz se a sessão mais recente segue em andamento.
        isOnline: { type: boolean }
        sessions:
          type: array
          items:
            $ref: "#/components/schemas/DeviceSession"

    FleetUpdateRequest:
      type: object
      properties:
        # Sem a lista = todas as TVs.
        deviceIds:
          type: array
          minItems: 1
          items: { type: integer }

    FleetUpdateResult:
      type: object
      required: [requested]
      properties:
        requested: { type: integer }

    # ── Playlist ─────────────────────────────────────────────────────────────
    PlaylistItem:
      type: object
      required: [id, deviceId, announcementId, displayOrder, isActive, title, imageUrl, duration, orientation]
      properties:
        id: { type: integer }
        deviceId: { type: integer }
        announcementId: { type: integer }
        displayOrder: { type: integer }
        isActive: { type: boolean }
        title: { type: string }
        # Nulo é estado normal da peça: nasce sem imagem quando não há upload, e
        # o poster é zerado ao trocar para YouTube. Proibir nulo aqui derrubava
        # as três rotas de playlist depois que a linha já estava no banco.
        imageUrl: { type: string, nullable: true }
        duration: { type: integer }
        # "landscape" | "portrait" da peça. O portal usa para avisar, na
        # playlist, o item que não toca na orientação atual da TV.
        orientation: { type: string }

    PlaylistItemInput:
      type: object
      required: [announcementId]
      properties:
        announcementId: { type: integer }
        displayOrder: { type: integer }

    PlaylistReorder:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: integer }

    # ── Display ──────────────────────────────────────────────────────────────
    DisplaySlide:
      type: object
      required: [announcementId, title, duration, mediaKind]
      properties:
        announcementId: { type: integer }
        campaignId: { type: integer, nullable: true }
        # `title` segue no payload só para não quebrar TVs com tv.html em cache
        # antigo. Quem vai ao ar é `displayText`, já resolvido pelo servidor:
        # null significa slide sem texto.
        title: { type: string }
        displayText: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        duration: { type: integer }
        qrImageUrl: { type: string, nullable: true }
        mediaKind: { type: string }
        youtubeId: { type: string, nullable: true }
        playbackMode: { type: string, nullable: true }
        audioMode: { type: string, nullable: true }
        videoIds:
          type: array
          nullable: true
          items: { type: string }

    DevicePreviewSlide:
      allOf:
        - $ref: "#/components/schemas/DisplaySlide"
        - type: object
          required: [source]
          properties:
            source:
              type: string
              enum: [campaign, panel, playlist, alert, editorial]

    DisplayFeed:
      type: object
      required: [screen, slides]
      properties:
        screen:
          type: object
          required: [orientation]
          properties:
            orientation: { type: string, enum: [landscape, portrait_right, portrait_left] }
        # Música de fundo da TV. Fora de `slides` de propósito: não é peça,
        # não conta exibição.
        music:
          type: ["object", "null"]
          required: [kind, youtubeId]
          properties:
            kind: { type: string, enum: [youtube_video, youtube_playlist] }
            youtubeId: { type: string }
        # Faixa de recados no rodapé. Fora de `slides`: não é peça, não conta
        # exibição. Nulo = TV sem faixa (ou aviso urgente no ar).
        ticker:
          type: ["object", "null"]
          required: [text]
          properties:
            text: { type: string }
        # Aviso para o app Android checar atualização agora. O servidor só
        # avisa: o app segue lendo o update.json e conferindo o APK.
        appUpdate:
          type: ["object", "null"]
          required: [version, forcedAt]
          properties:
            # Última release conhecida; nulo quando o servidor não conseguiu ler.
            version: { type: ["string", "null"] }
            # Quando o admin pediu, enquanto o pedido tem menos de 15 minutos.
            forcedAt: { type: ["string", "null"], format: date-time }
        slides:
          type: array
          items:
            $ref: "#/components/schemas/DisplaySlide"

    YouTubeMeta:
      type: object
      required: [kind, id, orientation]
      properties:
        kind: { type: string, enum: [youtube_video, youtube_playlist] }
        id: { type: string }
        orientation: { type: string, enum: [landscape, portrait] }

    # ── Telemetry ────────────────────────────────────────────────────────────
    PlayInput:
      type: object
      required: [deviceKey, announcementId, durationSeconds]
      properties:
        deviceKey: { type: string }
        announcementId: { type: integer }
        campaignId: { type: integer, nullable: true }
        durationSeconds: { type: number }

    PlayBatchItem:
      type: object
      required: [playId, announcementId, durationSeconds, ageSeconds]
      properties:
        playId: { type: string, minLength: 8, maxLength: 40 }
        announcementId: { type: integer }
        campaignId: { type: integer, nullable: true }
        durationSeconds: { type: number, minimum: 0, maximum: 86400 }
        ageSeconds: { type: number, minimum: 0 }

    PlayBatchInput:
      type: object
      required: [deviceKey, plays]
      properties:
        deviceKey: { type: string }
        plays:
          type: array
          minItems: 1
          maxItems: 200
          items:
            $ref: "#/components/schemas/PlayBatchItem"

    PlayBatchResult:
      type: object
      required: [accepted, duplicates, discarded]
      properties:
        accepted: { type: integer }
        duplicates: { type: integer }
        discarded: { type: integer }

    VitrinePlaysInput:
      type: object
      required: [orientation, plays]
      properties:
        orientation: { type: string, enum: [landscape, portrait] }
        plays:
          type: array
          minItems: 1
          # Lote pequeno: a rota é pública, e um visitante gera poucas
          # exibições a cada 15 s.
          maxItems: 10
          items:
            $ref: "#/components/schemas/PlayBatchItem"

    # ── Analytics ────────────────────────────────────────────────────────────
    AnnouncementPlayStat:
      type: object
      required: [announcementId, title, plays, totalDuration]
      properties:
        announcementId: { type: integer }
        title: { type: string }
        plays: { type: integer }
        totalDuration: { type: integer }
        scans: { type: integer }
        scanRate: { type: number }

    AnalyticsPeriod:
      type: object
      required: [days, from, to]
      properties:
        days: { type: integer, enum: [7, 30, 90] }
        from: { type: string, description: "Primeiro dia (YYYY-MM-DD, horário de São Paulo)" }
        to: { type: string, description: "Último dia (YYYY-MM-DD)" }

    AnalyticsTotals:
      type: object
      required: [plays, durationSeconds, scans, uniqueVisitors, scanRate]
      properties:
        plays: { type: integer }
        durationSeconds: { type: integer }
        scans: { type: integer }
        uniqueVisitors: { type: integer }
        scanRate: { type: number }

    AnalyticsOverviewTotals:
      type: object
      required: [plays, durationSeconds, scans, uniqueVisitors, scanRate, previous]
      properties:
        plays: { type: integer }
        durationSeconds: { type: integer }
        scans: { type: integer }
        uniqueVisitors: { type: integer }
        scanRate: { type: number }
        previous:
          $ref: "#/components/schemas/AnalyticsTotals"

    AnalyticsNow:
      type: object
      required: [devices, devicesOnline, clients]
      properties:
        devices: { type: integer }
        devicesOnline: { type: integer }
        clients: { type: integer }

    AnalyticsDay:
      type: object
      required: [date, plays, scans, activeDevices, totalDevices]
      properties:
        date: { type: string }
        plays: { type: integer }
        scans: { type: integer }
        activeDevices:
          type: integer
          nullable: true
          description: TVs que se conectaram no dia; nulo antes do começo do histórico
        totalDevices: { type: integer }

    AnalyticsOverview:
      type: object
      required: [period, totals, now, series]
      properties:
        period:
          $ref: "#/components/schemas/AnalyticsPeriod"
        totals:
          $ref: "#/components/schemas/AnalyticsOverviewTotals"
        now:
          $ref: "#/components/schemas/AnalyticsNow"
        series:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDay"

    AnalyticsHour:
      type: object
      required: [hour, plays]
      properties:
        hour: { type: integer }
        plays: { type: integer }

    AnalyticsHourly:
      type: object
      required: [period, hours]
      properties:
        period:
          $ref: "#/components/schemas/AnalyticsPeriod"
        hours:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsHour"

    AnalyticsCampaignRank:
      type: object
      required: [campaignId, name, advertiserName, plays]
      properties:
        campaignId: { type: integer }
        name: { type: string }
        advertiserName: { type: string }
        plays: { type: integer }

    AnalyticsDeviceRank:
      type: object
      required: [deviceId, name, clientName, plays]
      properties:
        deviceId: { type: integer }
        name: { type: string }
        clientName: { type: string }
        plays: { type: integer }

    AnalyticsAnnouncementRank:
      type: object
      required: [announcementId, title, plays, scans, scanRate, durationSeconds]
      properties:
        announcementId: { type: integer }
        title: { type: string }
        plays: { type: integer }
        scans: { type: integer }
        scanRate: { type: number }
        durationSeconds: { type: integer }

    AnalyticsRankings:
      type: object
      required: [period, campaigns, devices, announcements]
      properties:
        period:
          $ref: "#/components/schemas/AnalyticsPeriod"
        campaigns:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsCampaignRank"
        devices:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsDeviceRank"
        announcements:
          type: array
          items:
            $ref: "#/components/schemas/AnalyticsAnnouncementRank"

    ClientAnalytics:
      type: object
      required: [clientId, clientName, totalDevices, totalPlays, totalDuration]
      properties:
        clientId: { type: integer }
        clientName: { type: string }
        totalDevices: { type: integer }
        totalPlays: { type: integer }
        totalDuration: { type: integer }
        topAnnouncements:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementPlayStat"

    DeviceAnalytics:
      type: object
      required: [deviceId, deviceName, clientId, clientName, totalPlays, totalDuration]
      properties:
        deviceId: { type: integer }
        deviceName: { type: string }
        clientId: { type: integer }
        clientName: { type: string }
        totalPlays: { type: integer }
        totalDuration: { type: integer }
        byAnnouncement:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementPlayStat"

    AnnouncementAnalytics:
      type: object
      required: [announcementId, title, totalPlays, totalDuration]
      properties:
        announcementId: { type: integer }
        title: { type: string }
        totalPlays: { type: integer }
        totalDuration: { type: integer }
        totalScans: { type: integer }
        totalUniqueScans: { type: integer }
        scanRate: { type: number }
        byCampaign:
          type: array
          items:
            type: object
            required: [campaignId, campaignName, plays, scans, scanRate]
            properties:
              campaignId: { type: integer }
              campaignName: { type: string }
              plays: { type: integer }
              scans: { type: integer }
              scanRate: { type: number }
        byDevice:
          type: array
          items:
            type: object
            required: [deviceId, deviceName, clientName, plays, totalDuration]
            properties:
              deviceId: { type: integer }
              deviceName: { type: string }
              clientName: { type: string }
              plays: { type: integer }
              totalDuration: { type: integer }

    CampaignAnalytics:
      type: object
      required: [campaignId, campaignName, advertiserId, advertiserName, startsAt, endsAt, totalPlays, totalScans, totalUniqueScans, scanRate]
      properties:
        campaignId: { type: integer }
        campaignName: { type: string }
        advertiserId: { type: integer }
        advertiserName: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        totalPlays: { type: integer }
        totalScans: { type: integer }
        totalUniqueScans: { type: integer }
        scanRate: { type: number }
        byAnnouncement:
          type: array
          items:
            $ref: "#/components/schemas/AnnouncementPlayStat"

    # ── Users ────────────────────────────────────────────────────────────────
    UserAccount:
      type: object
      required: [id, email, name, isAdmin, isActive, mustChangePassword, clientIds, advertiserIds]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: ["string", "null"] }
        isAdmin: { type: boolean }
        isActive: { type: boolean }
        mustChangePassword: { type: boolean }
        clientIds: { type: array, items: { type: integer } }
        advertiserIds: { type: array, items: { type: integer } }
    UserInput:
      type: object
      required: [email, tempPassword]
      properties:
        email: { type: string }
        tempPassword: { type: string, minLength: 8 }
        name: { type: ["string", "null"] }
        isAdmin: { type: boolean }
        clientIds: { type: array, items: { type: integer } }
        advertiserIds: { type: array, items: { type: integer } }
    UserUpdate:
      type: object
      properties:
        name: { type: ["string", "null"] }
        isAdmin: { type: boolean }
        isActive: { type: boolean }
        clientIds: { type: array, items: { type: integer } }
        advertiserIds: { type: array, items: { type: integer } }
    ResetPasswordBody:
      type: object
      required: [tempPassword]
      properties:
        tempPassword: { type: string, minLength: 8 }

    # ── Portal ───────────────────────────────────────────────────────────────
    PortalCampaign:
      type: object
      required: [id, name, startsAt, endsAt, isActive, deviceCount, totalPlays, totalScans, uniqueVisitors]
      properties:
        id: { type: integer }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }
        deviceCount: { type: integer }
        totalPlays: { type: integer }
        totalScans: { type: integer }
        uniqueVisitors: { type: integer }
    PortalDevice:
      type: object
      required: [id, name, orientation, totalPlays]
      properties:
        id: { type: integer }
        name: { type: string }
        location: { type: string, nullable: true }
        orientation: { type: string }
        lastSeenAt: { type: string, format: date-time, nullable: true }
        totalPlays: { type: integer }

    PortalClient:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    # ── Panels (client portal) ──────────────────────────────────────────────
    PanelItem:
      type: object
      required: [id, panelId, name, priceCents, displayOrder, isActive, featured]
      properties:
        id: { type: integer }
        panelId: { type: integer }
        name: { type: string }
        description: { type: string, nullable: true }
        priceCents: { type: integer, minimum: 0 }
        oldPriceCents: { type: integer, minimum: 0, nullable: true }
        category: { type: string, nullable: true }
        imageUrl: { type: string, nullable: true }
        unit: { type: string, maxLength: 12, nullable: true }
        featured: { type: boolean }
        displayOrder: { type: integer }
        isActive: { type: boolean }

    PanelItemInput:
      type: object
      required: [name, priceCents]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 200, nullable: true }
        priceCents: { type: integer, minimum: 0, maximum: 100000000 }
        oldPriceCents: { type: integer, minimum: 0, maximum: 100000000, nullable: true }
        category: { type: string, maxLength: 60, nullable: true }
        imageUrl: { type: string, maxLength: 500, nullable: true }
        unit: { type: string, maxLength: 12, nullable: true }
        featured: { type: boolean }

    Panel:
      type: object
      required: [id, clientId, kind, name, template, status, duration, artOutdated, createdAt, updatedAt, items]
      properties:
        id: { type: integer }
        clientId: { type: integer }
        kind: { type: string, enum: [menu, promo, notice, flyer] }
        name: { type: string }
        template: { type: string }
        status: { type: string, enum: [draft, published] }
        duration: { type: integer }
        headline: { type: string, nullable: true }
        body: { type: string, nullable: true }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
        promoStyle: { type: string, enum: [price, percent], nullable: true }
        photoOffset: { type: integer, minimum: 0, maximum: 100, nullable: true }
        photoOffsetX: { type: integer, minimum: 0, maximum: 100, nullable: true }
        campaignId: { type: integer, nullable: true }
        artOutdated: { type: boolean }
        publishedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: "#/components/schemas/PanelItem" }
        publishedCampaign:
          nullable: true
          $ref: "#/components/schemas/PublishedCampaign"

    CreatePanelRequest:
      type: object
      required: [kind, name, template]
      properties:
        kind: { type: string, enum: [menu, promo, notice, flyer] }
        name: { type: string, minLength: 1, maxLength: 80 }
        template: { type: string, minLength: 1, maxLength: 40 }
        clientId: { type: integer }

    CopyPanelRequest:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: integer, minimum: 1 }

    UpdatePanelRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        template: { type: string, minLength: 1, maxLength: 40 }
        duration: { type: integer, minimum: 5, maximum: 60 }
        headline: { type: string, maxLength: 80, nullable: true }
        body: { type: string, maxLength: 300, nullable: true }
        accentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
        promoStyle: { type: string, enum: [price, percent], nullable: true }
        photoOffset: { type: integer, minimum: 0, maximum: 100, nullable: true }
        photoOffsetX: { type: integer, minimum: 0, maximum: 100, nullable: true }
        campaignId: { type: integer, minimum: 1, nullable: true }

    ReplacePanelItemsRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/PanelItemInput" }

    PublishPanelResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [draft, published] }
        pages: { type: integer }

    UploadPanelImageRequest:
      type: object
      required: [image]
      properties:
        image: { type: string }

    PublishedCampaign:
      type: object
      required: [id, name, startsAt, endsAt, isActive]
      properties:
        id: { type: integer }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        isActive: { type: boolean }

    PanelCampaignOption:
      type: object
      required: [id, name, startsAt, endsAt]
      properties:
        id: { type: integer }
        name: { type: string }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }

    StoreIdentity:
      type: object
      required: [clientId, companyName]
      properties:
        clientId: { type: integer }
        companyName: { type: string }
        logoUrl: { type: string, nullable: true }
        openingHours: { type: string, maxLength: 120, nullable: true }
        brandColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
        brandAccentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
        address: { type: string, nullable: true }

    UpdateStoreIdentityRequest:
      type: object
      properties:
        logoUrl: { type: string, maxLength: 500, nullable: true }
        openingHours: { type: string, maxLength: 120, nullable: true }
        brandColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
        brandAccentColor: { type: string, pattern: "^#[0-9A-Fa-f]{6}$", nullable: true }
